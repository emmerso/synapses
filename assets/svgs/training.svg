<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Training illustration</title>
<desc>A presenter at a whiteboard with a growth chart, addressing three seated audience members, representing a training session</desc>

<circle cx="200" cy="200" r="190" fill="#FDF3E9"/>

<!-- Whiteboard -->
<rect x="70" y="80" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="3"/>
<rect x="86" y="96" width="128" height="88" rx="4" fill="#FCF6EB"/>

<!-- Growth chart on whiteboard -->
<polyline points="98,168 126,148 154,156 182,120 200,132"
          fill="none" stroke="#BA7517" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="132" r="5" fill="#BA7517"/>
<line x1="98" y1="176" x2="200" y2="176" stroke="#EF9F27" stroke-width="2"/>

<!-- Whiteboard stand legs -->
<line x1="90" y1="200" x2="80" y2="230" stroke="#854F0B" stroke-width="4" stroke-linecap="round"/>
<line x1="210" y1="200" x2="220" y2="230" stroke="#854F0B" stroke-width="4" stroke-linecap="round"/>

<!-- Presenter -->
<g transform="translate(238,150)">
  <circle cx="20" cy="14" r="16" fill="#F2A623"/>
  <path d="M0 100 C0 66 8 52 20 52 C32 52 40 66 40 100 Z" fill="#0C447C"/>
  <rect x="-8" y="60" width="16" height="52" rx="8" fill="#0C447C" transform="rotate(18 -8 60)"/>
</g>

<!-- Audience: three seated figures -->
<g transform="translate(96,236)">
  <circle cx="14" cy="10" r="12" fill="#D85A30"/>
  <path d="M0 70 C0 46 6 36 14 36 C22 36 28 46 28 70 Z" fill="#712B13"/>
</g>
<g transform="translate(150,240)">
  <circle cx="14" cy="10" r="12" fill="#F0997B"/>
  <path d="M0 66 C0 44 6 34 14 34 C22 34 28 44 28 66 Z" fill="#993C1D"/>
</g>
<g transform="translate(204,236)">
  <circle cx="14" cy="10" r="12" fill="#D85A30"/>
  <path d="M0 70 C0 46 6 36 14 36 C22 36 28 46 28 70 Z" fill="#712B13"/>
</g>

<!-- Floor line -->
<line x1="60" y1="322" x2="300" y2="322" stroke="#F0997B" stroke-width="3" opacity="0.4"/>
</svg>
