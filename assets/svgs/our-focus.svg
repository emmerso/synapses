<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Our focus illustration</title>
<desc>A person icon, a checkmarked document, and a rising bar chart with an arrow, representing people, evidence, and impact</desc>

<circle cx="100" cy="100" r="96" fill="#EAF1F8"/>

<!-- People: figure, lower left -->
<g transform="translate(30,96)">
  <circle cx="24" cy="16" r="16" fill="#152447"/>
  <path d="M0 78 C0 50 10 36 24 36 C38 36 48 50 48 78 Z" fill="#152447"/>
</g>

<!-- Evidence: document with checkmark, upper right -->
<g transform="translate(108,26)">
  <rect x="0" y="0" width="62" height="78" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="3"/>
  <rect x="12" y="16" width="38" height="6" rx="3" fill="#AFA9EC"/>
  <rect x="12" y="30" width="28" height="6" rx="3" fill="#CECBF6"/>
  <circle cx="31" cy="58" r="18" fill="#534AB7"/>
  <path d="M22 58 L28 65 L41 50" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Impact: rising bars with an upward arrow -->
<g transform="translate(78,120)">
  <rect x="0" y="36" width="16" height="30" rx="3" fill="#FAC775"/>
  <rect x="22" y="20" width="16" height="46" rx="3" fill="#EF9F27"/>
  <rect x="44" y="4" width="16" height="62" rx="3" fill="#BA7517"/>
  <path d="M64 30 L84 10 M84 10 L84 24 M84 10 L70 10" fill="none" stroke="#BA7517" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
