<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Data consultancy illustration</title>
<desc>A dashboard screen with bar and line charts, a magnifying glass, and floating data nodes representing data consultancy</desc>

<circle cx="200" cy="200" r="190" fill="#EAF6F1"/>

<!-- Floating data nodes -->
<circle cx="90" cy="110" r="7" fill="#5DCAA5"/>
<circle cx="320" cy="130" r="9" fill="#1D9E75"/>
<circle cx="310" cy="300" r="6" fill="#5DCAA5"/>
<circle cx="80" cy="290" r="8" fill="#0F6E56"/>
<line x1="90" y1="110" x2="130" y2="150" stroke="#9FE1CB" stroke-width="2"/>
<line x1="320" y1="130" x2="280" y2="160" stroke="#9FE1CB" stroke-width="2"/>

<!-- Monitor -->
<rect x="90" y="96" width="220" height="160" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="3"/>
<rect x="105" y="111" width="190" height="130" rx="4" fill="#F1FBF7"/>

<!-- Bar chart inside screen -->
<rect x="122" y="190" width="20" height="40" rx="3" fill="#9FE1CB"/>
<rect x="150" y="170" width="20" height="60" rx="3" fill="#5DCAA5"/>
<rect x="178" y="150" width="20" height="80" rx="3" fill="#1D9E75"/>
<rect x="206" y="165" width="20" height="65" rx="3" fill="#5DCAA5"/>

<!-- Line trend -->
<polyline points="122,140 150,128 178,134 206,118 234,124 262,108"
          fill="none" stroke="#0F6E56" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="262" cy="108" r="5" fill="#0F6E56"/>

<!-- Monitor stand -->
<rect x="188" y="256" width="24" height="20" fill="#0F6E56"/>
<rect x="160" y="276" width="80" height="10" rx="5" fill="#0F6E56"/>

<!-- Magnifying glass overlapping screen -->
<g transform="translate(230,220)">
  <circle cx="34" cy="34" r="30" fill="#FFFFFF" stroke="#085041" stroke-width="6"/>
  <line x1="56" y1="56" x2="82" y2="82" stroke="#085041" stroke-width="9" stroke-linecap="round"/>
  <path d="M20 34 a14 14 0 0 1 14 -14" fill="none" stroke="#5DCAA5" stroke-width="4" stroke-linecap="round"/>
</g>
</svg>
