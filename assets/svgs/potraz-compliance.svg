<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Regulatory compliance illustration</title>
<desc>A shield with a checkmark surrounded by document and lock icons, representing regulatory compliance</desc>

<circle cx="200" cy="200" r="190" fill="#EAF3FB"/>

<!-- Document behind shield, left -->
<g transform="translate(78,150)">
  <rect x="0" y="0" width="90" height="120" rx="6" fill="#FFFFFF" stroke="#B9D3EE" stroke-width="2"/>
  <rect x="16" y="22" width="58" height="6" rx="3" fill="#9CC0E8"/>
  <rect x="16" y="40" width="58" height="6" rx="3" fill="#C9DEF3"/>
  <rect x="16" y="58" width="40" height="6" rx="3" fill="#C9DEF3"/>
  <rect x="16" y="86" width="58" height="6" rx="3" fill="#C9DEF3"/>
  <rect x="16" y="100" width="30" height="6" rx="3" fill="#C9DEF3"/>
</g>

<!-- Document behind shield, right -->
<g transform="translate(232,150)">
  <rect x="0" y="0" width="90" height="120" rx="6" fill="#FFFFFF" stroke="#B9D3EE" stroke-width="2"/>
  <rect x="16" y="22" width="58" height="6" rx="3" fill="#9CC0E8"/>
  <rect x="16" y="40" width="58" height="6" rx="3" fill="#C9DEF3"/>
  <rect x="16" y="58" width="40" height="6" rx="3" fill="#C9DEF3"/>
  <rect x="16" y="86" width="58" height="6" rx="3" fill="#C9DEF3"/>
  <rect x="16" y="100" width="30" height="6" rx="3" fill="#C9DEF3"/>
</g>

<!-- Shield -->
<g>
  <path d="M200 78 L272 106 V196 C272 254 240 292 200 312 C160 292 128 254 128 196 V106 Z"
        fill="#1D6FBE" stroke="#0C447C" stroke-width="3"/>
  <path d="M200 96 L256 118 V196 C256 244 232 274 200 292 C168 274 144 244 144 196 V118 Z"
        fill="#2C82D4"/>
  <!-- Checkmark -->
  <path d="M168 196 L192 222 L236 168" fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Small lock badge, top right -->
<g transform="translate(280,92)">
  <circle cx="24" cy="24" r="24" fill="#0F6E56"/>
  <rect x="12" y="22" width="24" height="18" rx="3" fill="#FFFFFF"/>
  <path d="M16 22 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="#FFFFFF" stroke-width="4"/>
</g>
</svg>
